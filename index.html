<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F1 Speed</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('f1-car.jpg') no-repeat center center/cover;
      position: relative;
    }
    h1 {
      font-size: 4em;
      animation: zoomIn 3s ease-in-out infinite alternate;
    }
    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }
    .cta {
      position: absolute;
      bottom: 50px;
      padding: 15px 30px;
      background: red;
      border: none;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.3s;
    }
    .cta:hover {
      background: white;
      color: red;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Feel the Speed</h1>
    <button class="cta" onclick="window.location.href='index8.html'">Explore F1
    </button>
  </div>
</body>
</html>
